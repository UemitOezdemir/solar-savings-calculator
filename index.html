  <header class="header-wrapper">
    <div class="header">
      <div class="header__box-left">
        <h1 class="header__headline">PHOTOVOLTAIC CALCULATOR</h1>
        <p class="deko-headline">Your path to renewable energy</p>
      </div>
      <p class="header__box-right">In just 5 minutes, calculate how much you can save by switching to solar energy, with no obligation. Visualize your roof with the possible module layout.</p>
    </div>
  </header>
  <main>
    <section class="main-content">
      <div class="selection-wrapper">
        <article class="selection" aria-labelledby="headline">
          <header class="selection__header-wrapper">
            <h2 id="headline" class="selection__header" data-element="headline"></h2>
            <button type="button" class="selection__info-btn">
              <svg class="selection__info-icon">
                <use href="#info-icon"></use>
              </svg>
            </button>
            <span data-element="progress-counter"></span>
          </header>
          <div class="selection__body" data-element="main-content-container">
            <div class="selection__body-setup-controls" data-element="control-elements-container"></div>
          </div>
          <footer class="selection__footer" data-element="progress-btn-container">
          </footer>
        </article>
      </div>
      <div class="map-container">
        <div id="map-preview" data-disabled="true"></div>
        <div id="map"></div>
      </div>
    </section>
  </main>
